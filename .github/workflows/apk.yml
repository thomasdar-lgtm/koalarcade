name: APK Android

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build
        working-directory: android
        run: gradle assembleRelease --no-daemon 2>&1 | tee ../build.log; exit ${PIPESTATUS[0]}

      - name: Prepare APK
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          cp android/app/build/outputs/apk/release/app-release.apk Koalarcade.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ env.VERSION }}
          name: Koalarcade Android ${{ env.VERSION }}
          body: "Télécharge **Koalarcade.apk** ci-dessous puis ouvre-le sur ton téléphone Android. Les jeux se mettent à jour tout seuls, pas besoin de réinstaller l'APK."
          files: Koalarcade.apk
          make_latest: true

      - name: Report
        if: always()
        run: |
          RESULT="${{ job.status }}"
          mkdir -p /tmp/report
          echo "$RESULT ${GITHUB_SHA}" > /tmp/report/status.txt
          if [ -f build.log ]; then
            grep -E "error:|FAILURE|FAILED|What went wrong|BUILD (SUCCESSFUL|FAILED)|\.java:[0-9]+|\.xml:[0-9]+|AAPT|Could not" build.log | head -200 > /tmp/report/errors.txt || true
            tail -150 build.log > /tmp/report/tail.txt
          fi
          cd /tmp/report
          git init -q -b build-logs
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "$RESULT ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" build-logs
